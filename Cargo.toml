[package]
name = "hogyoku"
version = "0.1.0"
edition = "2021"

[lib]
name = "raft_core"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "api_gateway"
path = "src/bin/api_gateway.rs"

[dependencies]
axum = "0.7.5"
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
futures = "0.3.31"
rand = "0.9.2"
rustyline = "17.0.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tarpc = { version = "0.37.0", features = ["serde-transport", "serde-transport-json", "serde1", "tcp", "tokio1"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
